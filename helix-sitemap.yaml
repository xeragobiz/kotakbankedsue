sitemaps:
  kotak:
    origin: https://www.kotak.bank.in
    lastmod: YYYY-MM-DD
    default: en
    languages:
      en:
        source: /en-in/query-index.json
        destination: /sitemap-en.xml
        hreflang: en
        # English is folder-mapped to root, so its public URLs (and <loc>)
        # must NOT carry the /en-in prefix. See note below on index paths.
        alternate: /{path}
      hi:
        source: /hi-in/query-index.json
        destination: /sitemap-hi.xml
        hreflang: hi
        alternate: /hi-in/{path}
    index:
      - /sitemap-en.xml
      - /sitemap-hi.xml
