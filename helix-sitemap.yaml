sitemaps:
  kotak:
    origin: https://www.kotak.bank.in
    lastmod: YYYY-MM-DD
    default: en
    languages:
      en:
        # English is folder-mapped to root, so its index target is the root
        # /query-index.json and its public URLs (and <loc>) carry no prefix.
        source: /query-index.json
        destination: /sitemap-en.xml
        hreflang: en
        alternate: /{path}
      hi:
        source: /hi-in/query-index.json
        destination: /sitemap-hi.xml
        hreflang: hi
        alternate: /hi-in/{path}

# NOTE: The top-level `index:` directive (which asks AEM to auto-generate
# /sitemap-index.xml) is not being honored by the sitemap generator for this
# project - rebuild jobs only ever emit sitemap-en.xml/sitemap-hi.xml and a
# direct request returns "Unable to find sitemap that has destination:
# /sitemap-index.xml". Until that platform behavior is resolved, the aggregated
# index is maintained as a static file at repo-root sitemap-index.xml.
# index:
#   - /sitemap-en.xml
#   - /sitemap-hi.xml
