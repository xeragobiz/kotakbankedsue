version: 1

indices:
  # English is folder-mapped to the site root (/content/kotakbankedsue/en-in/ -> /),
  # so its published pages live at root paths (e.g. /personal/accounts), NOT under
  # /en-in. The index therefore scopes to everything at root EXCEPT the other
  # language subtrees (hi-in, ta-in) and non-content/utility paths.
  en:
    include:
      - '/**'
    exclude:
      - '/**.json'
      - '/hi-in/**'
      - '/ta-in/**'
      - '/nav'
      - '/nav/**'
      - '/header'
      - '/footer'
      - '/fragments/**'
      - '/metadata'
      - '/placeholders'
      - '/redirects'
      - '/search'
      - '/apply'
      - '/track-application'
      - '/drafts/**'
      - '/**demo**'
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      lang:
        select: html
        value: attribute(el, "lang")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")

  hi:
    include:
      - '/hi-in/**'
    exclude:
      - '/**.json'
      - '/hi-in/nav'
      - '/hi-in/nav/**'
      - '/hi-in/header'
      - '/hi-in/footer'
      - '/hi-in/fragments/**'
      - '/hi-in/metadata'
      - '/hi-in/placeholders'
      - '/hi-in/search'
      - '/hi-in/apply'
      - '/hi-in/track-application'
      - '/hi-in/drafts/**'
      - '/hi-in/**demo**'
    target: /hi-in/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      lang:
        select: html
        value: attribute(el, "lang")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")
